<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: var(--figma-color-bg);
    --bg-raised: var(--figma-color-bg-secondary);
    --bg-input: var(--figma-color-bg-tertiary);
    --border: var(--figma-color-border);
    --border-focus: var(--figma-color-border-strong);
    --text: var(--figma-color-text);
    --text-muted: var(--figma-color-text-secondary);
    --text-dim: var(--figma-color-text-tertiary);
    --accent: var(--figma-color-text);
    --mono: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --code: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--mono);
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--figma-color-border); border-radius: 3px; }

  /* Header */
  .header {
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .header h1 { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .header p { color: var(--text-muted); font-size: 10px; }

  /* Ramps area */
  .ramps-area {
    flex: 1;
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    overflow: auto;
    align-items: flex-start;
  }

  /* Column */
  .ramp-col {
    min-width: 240px;
    width: 240px;
    flex-shrink: 0;
    background: var(--bg-raised);
    border-radius: 8px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .ramp-header {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .ramp-header input {
    background: transparent;
    border: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    outline: none;
    width: 100%;
    letter-spacing: 0.02em;
  }
  .ramp-header .remove-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    padding: 0 0 0 6px;
    line-height: 1;
    flex-shrink: 0;
  }
  .ramp-header .remove-btn:hover { color: var(--text-muted); }

  /* Unconfirmed state */
  .ramp-setup {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 12px;
    gap: 8px;
    min-height: 300px;
  }
  .color-preview {
    width: 36px; height: 36px;
    border-radius: 6px;
    border: 1px solid var(--border);
    transition: background 0.15s ease;
  }
  .hex-input {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-family: var(--code);
    font-size: 11px;
    padding: 6px 8px;
    outline: none;
    width: 100px;
    text-align: center;
  }
  .hex-input:focus { border-color: var(--border-focus); }
  .gen-btn {
    background: var(--accent);
    color: var(--figma-color-bg);
    border: none;
    border-radius: 5px;
    font-family: var(--code);
    font-size: 9px;
    font-weight: 600;
    padding: 5px 14px;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: opacity 0.15s;
  }
  .gen-btn:disabled { opacity: 0.3; cursor: default; }
  .gen-btn:not(:disabled):hover { opacity: 0.85; }
  .hint { font-family: var(--code); font-size: 8px; color: var(--text-dim); margin-top: 2px; }

  /* Swatch */
  .swatch {
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    cursor: pointer;
    transition: filter 0.12s ease;
  }
  .swatch:hover { filter: brightness(1.08); }
  .swatch-name { font-family: var(--mono); font-size: 12px; font-weight: 400; letter-spacing: 0; display: flex; gap: 4px; }
  .swatch-hex { font-family: var(--mono); font-size: 12px; font-weight: 400; letter-spacing: 0; display: flex; gap: 8px; opacity: 0.8; }

  /* Add button */
  .add-btn {
    min-width: 240px;
    width: 240px;
    height: 33px;
    flex-shrink: 0;
    align-self: flex-start;
    background: transparent;
    border: 1px dashed var(--figma-color-border);
    border-radius: 8px;
    color: var(--text-dim);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    font-weight: 300;
  }
  .add-btn:hover { background: var(--figma-color-bg-hover); color: var(--text-muted); border-color: var(--figma-color-border-strong); }
  .add-btn:disabled { opacity: 0.3; cursor: default; }

  /* Footer */
  .footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
  }
  .footer .collection-input {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 10px;
    padding: 6px 8px;
    outline: none;
    flex: 1;
    min-width: 0;
  }
  .footer .collection-input:focus { border-color: var(--border-focus); }
  .push-btn {
    background: #0d99ff;
    color: #fff;
    border: none;
    border-radius: 5px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    padding: 7px 14px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: opacity 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .push-btn:disabled { opacity: 0.4; cursor: default; }
  .push-btn:not(:disabled):hover { opacity: 0.85; }
  .count {
    font-family: var(--code);
    font-size: 9px;
    color: var(--text-dim);
    flex-shrink: 0;
  }

  /* Toast / status */
  .toast {
    position: fixed;
    bottom: 64px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-raised);
    color: var(--text);
    font-family: var(--code);
    font-size: 10px;
    padding: 6px 14px;
    border-radius: 4px;
    z-index: 100;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .toast.visible { opacity: 1; }

  /* Overwrite modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }
  .modal {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    max-width: 360px;
    width: 90%;
  }
  .modal h2 { font-size: 12px; font-weight: 600; margin-bottom: 8px; }
  .modal p { font-size: 10px; color: var(--text-muted); line-height: 1.5; margin-bottom: 12px; }
  .modal .dup-list {
    background: var(--bg-input);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: var(--code);
    font-size: 9px;
    color: var(--text-muted);
    max-height: 100px;
    overflow-y: auto;
    margin-bottom: 14px;
    line-height: 1.6;
    white-space: pre-line;
  }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .modal-actions button {
    font-family: var(--code);
    font-size: 10px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 5px;
    cursor: pointer;
    border: none;
    transition: opacity 0.15s;
  }
  .modal-actions button:hover { opacity: 0.85; }
  .modal-actions .btn-skip { background: var(--bg-input); color: var(--text-muted); }
  .modal-actions .btn-overwrite { background: #e74c3c; color: #fff; }
  .modal-actions .btn-cancel { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }

  /* Resize handle */
  .resize-handle {
    position: fixed;
    right: 0;
    bottom: 0;
    width: 16px;
    height: 16px;
    cursor: nwse-resize;
    z-index: 300;
  }
</style>
</head>
<body>

<div class="ramps-area" id="rampsArea"></div>

<div class="footer">
  <input class="collection-input" id="collectionName" value="Primitives" placeholder="Collection name" />
  <span class="count" id="rampCount">1 / 20</span>
  <button class="push-btn" id="pushBtn" disabled>Push to Figma</button>
</div>

<div class="toast" id="toast"></div>
<div class="resize-handle" id="resizeHandle"></div>

<!-- templates rendered by JS -->

<script>
// ─── State ──────────────────────────────────────────────────────────

var MAX_RAMPS = 20;
var nextId = 2;
var ramps = [
  { id: 1, name: "blue", hex: "#3b82f6", confirmed: true }
];

// ─── Color math ─────────────────────────────────────────────────────

function hexToHSL(hex) {
  hex = hex.replace("#", "");
  if (hex.length === 3) hex = hex.split("").map(function(c){return c+c;}).join("");
  var r = parseInt(hex.substring(0,2),16)/255;
  var g = parseInt(hex.substring(2,4),16)/255;
  var b = parseInt(hex.substring(4,6),16)/255;
  var max = Math.max(r,g,b), min = Math.min(r,g,b);
  var h, s, l = (max+min)/2;
  if (max === min) { h = s = 0; }
  else {
    var d = max - min;
    s = l > 0.5 ? d/(2-max-min) : d/(max+min);
    switch(max) {
      case r: h=((g-b)/d+(g<b?6:0))/6; break;
      case g: h=((b-r)/d+2)/6; break;
      case b: h=((r-g)/d+4)/6; break;
    }
  }
  return {h:h*360, s:s*100, l:l*100};
}

function hslToHex(h, s, l) {
  s/=100; l/=100;
  var a = s*Math.min(l,1-l);
  function f(n) {
    var k = (n+h/30)%12;
    var color = l - a*Math.max(Math.min(k-3,9-k,1),-1);
    return Math.round(255*Math.max(0,Math.min(1,color))).toString(16).padStart(2,"0");
  }
  return "#"+f(0)+f(8)+f(4);
}

function generateScale(hex) {
  var hsl = hexToHSL(hex);
  var steps = [];
  // Generate steps from 05 to 95 in increments of 5
  // Linear lightness: 05 = near white, 95 = near black, constant saturation
  for (var pct = 5; pct <= 95; pct += 5) {
    var t = pct / 100; // 0.05 to 0.95
    var newL = 100 - (t * 100); // linear from ~95% lightness down to ~5%
    var label = pct < 10 ? "0" + pct : "" + pct;
    steps.push({ step: label, hex: hslToHex(hsl.h, hsl.s, newL) });
  }
  return steps;
}

function getContrast(hex) {
  hex = hex.replace("#","");
  var r=parseInt(hex.substring(0,2),16);
  var g=parseInt(hex.substring(2,4),16);
  var b=parseInt(hex.substring(4,6),16);
  return (0.299*r+0.587*g+0.114*b)/255 > 0.55 ? "#000" : "#fff";
}

function hexToRgb255(hex) {
  hex = hex.replace("#","");
  return {
    r: parseInt(hex.substring(0,2),16),
    g: parseInt(hex.substring(2,4),16),
    b: parseInt(hex.substring(4,6),16)
  };
}

function isValidHex(hex) {
  return /^#?([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})$/.test(hex);
}

// ─── Render ─────────────────────────────────────────────────────────

function render() {
  var area = document.getElementById("rampsArea");
  area.innerHTML = "";

  ramps.forEach(function(ramp) {
    var col = document.createElement("div");
    col.className = "ramp-col";

    // Header
    var header = document.createElement("div");
    header.className = "ramp-header";
    var nameInput = document.createElement("input");
    nameInput.value = ramp.name;
    nameInput.placeholder = "token name";
    nameInput.addEventListener("input", function(e) {
      ramp.name = e.target.value.toLowerCase().replace(/[^a-z0-9-]/g,"");
      e.target.value = ramp.name;
      updatePushBtn();
    });
    var removeBtn = document.createElement("button");
    removeBtn.className = "remove-btn";
    removeBtn.textContent = "×";
    removeBtn.addEventListener("click", function() {
      ramps = ramps.filter(function(r){return r.id !== ramp.id;});
      render();
    });
    header.appendChild(nameInput);
    header.appendChild(removeBtn);
    col.appendChild(header);

    if (!ramp.confirmed) {
      // Setup UI
      var setup = document.createElement("div");
      setup.className = "ramp-setup";

      var preview = document.createElement("div");
      preview.className = "color-preview";
      preview.style.background = isValidHex(ramp.hex||"") ? (ramp.hex.startsWith("#")?ramp.hex:"#"+ramp.hex) : "rgba(255,255,255,0.04)";

      var hexInp = document.createElement("input");
      hexInp.className = "hex-input";
      hexInp.value = ramp.hex || "";
      hexInp.placeholder = "#000000";
      hexInp.maxLength = 7;
      hexInp.addEventListener("input", function(e) {
        ramp.hex = e.target.value;
        preview.style.background = isValidHex(e.target.value) ? (e.target.value.startsWith("#")?e.target.value:"#"+e.target.value) : "rgba(255,255,255,0.04)";
        genBtn.disabled = !isValidHex(e.target.value);
      });

      var genBtn = document.createElement("button");
      genBtn.className = "gen-btn";
      genBtn.textContent = "Generate";
      genBtn.disabled = !isValidHex(ramp.hex||"");
      genBtn.addEventListener("click", function() {
        var h = ramp.hex.trim();
        if (!h.startsWith("#")) h = "#" + h;
        if (isValidHex(h)) { ramp.hex = h; ramp.confirmed = true; render(); }
      });

      hexInp.addEventListener("keydown", function(e) {
        if (e.key === "Enter") genBtn.click();
      });

      var hint = document.createElement("div");
      hint.className = "hint";
      hint.textContent = "enter hex + press enter";

      setup.appendChild(preview);
      setup.appendChild(hexInp);
      setup.appendChild(genBtn);
      setup.appendChild(hint);
      col.appendChild(setup);

      // auto-focus
      setTimeout(function(){ hexInp.focus(); }, 30);

    } else {
      // Swatches
      var scale = generateScale(ramp.hex);
      scale.forEach(function(s) {
        var swatch = document.createElement("div");
        swatch.className = "swatch";
        swatch.style.background = s.hex;
        var contrast = getContrast(s.hex);
        swatch.style.color = contrast;

        var nameLine = document.createElement("div");
        nameLine.className = "swatch-name";
        var nameSpan = document.createElement("span");
        nameSpan.textContent = ramp.name;
        var slashSpan = document.createElement("span");
        slashSpan.textContent = "/";
        var stepSpan = document.createElement("span");
        stepSpan.textContent = s.step;
        nameLine.appendChild(nameSpan);
        nameLine.appendChild(slashSpan);
        nameLine.appendChild(stepSpan);

        var hexLine = document.createElement("div");
        hexLine.className = "swatch-hex";
        var hexVal = s.hex.toUpperCase();
        var rgb = hexToRgb255(s.hex);
        var hexSpan = document.createElement("span");
        hexSpan.textContent = hexVal;
        var dashSpan = document.createElement("span");
        dashSpan.textContent = "–";
        var rgbSpan = document.createElement("span");
        rgbSpan.textContent = rgb.r + ", " + rgb.g + ", " + rgb.b;
        hexLine.appendChild(hexSpan);
        hexLine.appendChild(dashSpan);
        hexLine.appendChild(rgbSpan);

        swatch.appendChild(nameLine);
        swatch.appendChild(hexLine);

        swatch.addEventListener("click", function() {
          copyText(hexVal);
          hexSpan.textContent = "copied!";
          dashSpan.style.display = "none";
          rgbSpan.style.display = "none";
          setTimeout(function(){ hexSpan.textContent = hexVal; dashSpan.style.display = ""; rgbSpan.style.display = ""; }, 1000);
        });

        col.appendChild(swatch);
      });
    }

    area.appendChild(col);
  });

  // Add button
  var addBtn = document.createElement("button");
  addBtn.className = "add-btn";
  addBtn.textContent = "+";
  addBtn.disabled = ramps.length >= MAX_RAMPS;
  addBtn.title = ramps.length >= MAX_RAMPS ? "Maximum 20 ramps" : "Add color ramp";
  addBtn.addEventListener("click", function() {
    if (ramps.length >= MAX_RAMPS) return;
    ramps.push({ id: nextId++, name: "color-" + (nextId-1), hex: "", confirmed: false });
    render();
    setTimeout(function(){
      area.scrollLeft = area.scrollWidth;
      var cols = area.querySelectorAll(".ramp-col");
      var last = cols[cols.length - 1];
      if (last) { var inp = last.querySelector(".ramp-header input"); if (inp) { inp.focus(); inp.select(); } }
    }, 30);
  });
  area.appendChild(addBtn);

  updatePushBtn();
  document.getElementById("rampCount").textContent = ramps.length + " / " + MAX_RAMPS;
}

function updatePushBtn() {
  var confirmed = ramps.filter(function(r){return r.confirmed;});
  var btn = document.getElementById("pushBtn");
  if (confirmed.length === 0) { btn.disabled = true; return; }
  // Disable if any confirmed ramp has an empty name
  for (var i = 0; i < confirmed.length; i++) {
    if (!confirmed[i].name) { btn.disabled = true; return; }
  }
  // Disable if any two confirmed ramps share a name
  var seen = {};
  for (var i = 0; i < confirmed.length; i++) {
    if (seen[confirmed[i].name]) { btn.disabled = true; return; }
    seen[confirmed[i].name] = true;
  }
  btn.disabled = false;
}

function copyText(text) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  document.body.removeChild(ta);
}

function showToast(msg, duration) {
  var toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("visible");
  setTimeout(function(){ toast.classList.remove("visible"); }, duration || 2500);
}

// ─── Push to Figma ──────────────────────────────────────────────────

document.getElementById("pushBtn").addEventListener("click", function() {
  var confirmed = ramps.filter(function(r){return r.confirmed;});
  if (confirmed.length === 0) return;

  var data = confirmed.map(function(r) {
    return {
      name: r.name,
      steps: generateScale(r.hex).map(function(s) {
        return { step: s.step, hex: s.hex };
      })
    };
  });

  var collectionName = document.getElementById("collectionName").value.trim() || "Primitives";

  parent.postMessage({
    pluginMessage: {
      type: "push-variables",
      ramps: data,
      collectionName: collectionName,
    }
  }, "*");

  document.getElementById("pushBtn").disabled = true;
  document.getElementById("pushBtn").textContent = "Pushing…";
});

// ─── Messages from plugin sandbox ───────────────────────────────────

window.onmessage = function(event) {
  var msg = event.data.pluginMessage;
  if (!msg) return;

  if (msg.type === "success") {
    var parts = [];
    if (msg.created > 0) parts.push(msg.created + " created");
    if (msg.updated > 0) parts.push(msg.updated + " updated");
    if (msg.skipped > 0) parts.push(msg.skipped + " skipped");
    showToast("✓ " + parts.join(", "), 3000);
    document.getElementById("pushBtn").disabled = false;
    document.getElementById("pushBtn").textContent = "Push to Figma";
  }

  if (msg.type === "error") {
    showToast("Error: " + msg.message, 4000);
    document.getElementById("pushBtn").disabled = false;
    document.getElementById("pushBtn").textContent = "Push to Figma";
  }

  if (msg.type === "confirm-overwrite") {
    showOverwriteModal(msg.duplicates, msg.ramps, msg.collectionName);
    document.getElementById("pushBtn").disabled = false;
    document.getElementById("pushBtn").textContent = "Push to Figma";
  }
};

// ─── Overwrite modal ────────────────────────────────────────────────

function showOverwriteModal(duplicates, pushRamps, collectionName) {
  var overlay = document.createElement("div");
  overlay.className = "modal-overlay";

  var modal = document.createElement("div");
  modal.className = "modal";

  var h2 = document.createElement("h2");
  h2.textContent = "Variables already exist";

  var p = document.createElement("p");
  p.textContent = duplicates.length + " variable" + (duplicates.length > 1 ? "s" : "") + " already exist in this collection:";

  var list = document.createElement("div");
  list.className = "dup-list";
  list.textContent = duplicates.join("\n");

  var actions = document.createElement("div");
  actions.className = "modal-actions";

  var cancelBtn = document.createElement("button");
  cancelBtn.className = "btn-cancel";
  cancelBtn.textContent = "Cancel";
  cancelBtn.addEventListener("click", function() { overlay.remove(); });

  var skipBtn = document.createElement("button");
  skipBtn.className = "btn-skip";
  skipBtn.textContent = "Skip existing";
  skipBtn.addEventListener("click", function() {
    overlay.remove();
    parent.postMessage({ pluginMessage: {
      type: "confirm-overwrite-skip",
      ramps: pushRamps,
      collectionName: collectionName,
    }}, "*");
  });

  var overwriteBtn = document.createElement("button");
  overwriteBtn.className = "btn-overwrite";
  overwriteBtn.textContent = "Overwrite";
  overwriteBtn.addEventListener("click", function() {
    overlay.remove();
    parent.postMessage({ pluginMessage: {
      type: "confirm-overwrite-yes",
      ramps: pushRamps,
      collectionName: collectionName,
    }}, "*");
  });

  actions.appendChild(cancelBtn);
  actions.appendChild(skipBtn);
  actions.appendChild(overwriteBtn);

  modal.appendChild(h2);
  modal.appendChild(p);
  modal.appendChild(list);
  modal.appendChild(actions);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

// ─── Resize handle ──────────────────────────────────────────────────
(function() {
  var handle = document.getElementById("resizeHandle");
  var startX, startY, startW, startH;

  handle.addEventListener("pointerdown", function(e) {
    startX = e.clientX;
    startY = e.clientY;
    startW = window.innerWidth;
    startH = window.innerHeight;
    handle.setPointerCapture(e.pointerId);

    function onMove(e) {
      var w = Math.round(Math.max(520, startW + (e.clientX - startX)));
      var h = Math.round(Math.max(200, startH + (e.clientY - startY)));
      parent.postMessage({ pluginMessage: { type: "resize", width: w, height: h } }, "*");
    }
    function onUp(e) {
      handle.removeEventListener("pointermove", onMove);
      handle.removeEventListener("pointerup", onUp);
    }
    handle.addEventListener("pointermove", onMove);
    handle.addEventListener("pointerup", onUp);
  });
})();

// ─── Init ───────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
